name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tools
      - run: npm test
        working-directory: tools
      # #175: the structural stress sweep (120 generation configs) used to run
      # nowhere, so it sat red on main for weeks while the acceptance suite stayed
      # green. It is the only check that sweeps the generator this broadly, so it
      # runs on every push now. `if: always()` so a failure here is still reported
      # when the suite above has already failed.
      - run: npm run stress
        working-directory: tools
        if: always()
